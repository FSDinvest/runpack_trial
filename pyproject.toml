[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "runpack_trial"
version = "0.2.0"
description = "PyArmor trial runtime (id 000000, linux x86_64, Python 3.14) for FSDI obfuscated Odoo modules. Development only."
requires-python = ">=3.14"
dependencies = []

[tool.setuptools]
packages = ["pyarmor_runtime_000000"]

[tool.setuptools.package-data]
pyarmor_runtime_000000 = ["*.so"]
